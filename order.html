<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Order Successful</title>

  <style>
    :root {
      --brown: #4B2E1E;
      --coffee: #6F4E37;
      --cream: #F6EDE6;
      --light: #FBF6F1;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--coffee);
      /* 🔥 MATCH MAIN SITE */
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
    }

    h1 {
      color: white;
      margin-bottom: 8px;
    }

    p {
      margin-bottom: 20px;
      color: #eee;
    }

    /* CARD */
    .container {
      width: 420px;
      height: 420px;
      /* ✅ SAME as width = square */

      background: var(--cream);
      padding: 25px;
      border-radius: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      overflow-y: auto;
      /* keeps scroll if content overflows */
    }

    h3 {
      text-align: center;
      color: var(--coffee);
      margin-bottom: 10px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      margin: 6px 0;
      background: white;
      /* 🔥 cleaner like cart */
      padding: 10px;
      border-radius: 10px;
      font-size: 14px;
    }

    .total {
      text-align: center;
      font-weight: bold;
      margin-top: 10px;
      color: var(--brown);
      font-size: 18px;
    }

    .payment {
      text-align: center;
      font-size: 14px;
      color: var(--coffee);
    }

    .btn {
      padding: 14px;
      width: 100%;
      border: none;
      background: var(--brown);
      /* 🔥 SAME BUTTON STYLE */
      color: white;
      border-radius: 25px;
      cursor: pointer;
      font-size: 15px;
      transition: 0.3s;
    }

    .btn:hover {
      background: var(--coffee);
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <h1>Order Successful ✅</h1>
  <p>Thank you! Your payment has been received 🎉</p>

  <div class="container">

    <div>
      <h3>Order Details</h3>
      <div id="bill"></div>
    </div>

    <div>
      <div class="total">
        Total Paid: ₹<span id="total"></span>
      </div>
      <div class="payment">
        Payment Method: <span id="payment"></span>
      </div>
    </div>

    <button class="btn" onclick="goHome()">Back to Home</button>

  </div>

  <script>
    const order = JSON.parse(localStorage.getItem("orderData"));

    const billDiv = document.getElementById("bill");
    const totalSpan = document.getElementById("total");
    const paymentSpan = document.getElementById("payment");

    if (!order || !order.items || order.items.length === 0) {
      billDiv.innerHTML = "<p style='text-align:center;'>No order found ❌</p>";
      totalSpan.textContent = "0";
      paymentSpan.textContent = "-";
    } else {

      let html = "";

      order.items.forEach(item => {
        let price = Number(item.price);
        let qty = Number(item.quantity);
        let itemTotal = price * qty;

        html += `
      <div class="row">
        <span>${item.name} (x${qty})</span>
        <span>₹${itemTotal}</span>
      </div>
    `;
      });

      billDiv.innerHTML = html;
      totalSpan.textContent = order.total;
      paymentSpan.textContent = order.payment;

      localStorage.removeItem("orderData");
    }

    function goHome() {
      window.location.href = "main_page.php";
    }
  </script>

</body>

</html>
