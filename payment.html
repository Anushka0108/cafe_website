<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Payment</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

  <style>
    /* Extra inputs for card/UPI */
    .payment-details {
      display: none;
      margin-top: 10px;
    }

    .payment-details input,
    .payment-details select {
      width: 100%;
      margin: 5px 0;
      padding: 8px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Payment</h1>
      <p>Complete your order</p>
    </div>

    <!-- ORDER SUMMARY -->
    <div class="card">
      <h3>Order Summary</h3>
      <div id="summary"></div>
      <hr>
      <div class="row total">
        <span>Total</span>
        <span id="total">₹0</span>
      </div>
    </div>
    <form id="paymentForm">

      <!-- PAYMENT METHODS -->
      <div class="card">
        <h3>Select Payment Method</h3>

        <!-- CARD -->
        <label class="pay-option">
          <input type="radio" name="payment" value="Card">
          💳 Card
        </label>
        <div id="cardDetails" class="payment-details">
          <input type="text" name="cardNumber" placeholder="Card Number (16 digits)" maxlength="16">
          <input type="text" name="expiry" placeholder="MM/YY">
          <input type="text" name="cvv" placeholder="CVV (3 digits)" maxlength="3">
        </div>

        <!-- UPI -->
        <label class="pay-option">
          <input type="radio" name="payment" value="UPI">
          📱 UPI
        </label>
        <div id="upiDetails" class="payment-details">
          <select name="upiApp">
            <option value="">Select UPI App</option>
            <option>Google Pay</option>
            <option>PhonePe</option>
            <option>Paytm</option>
          </select>
          <input type="text" name="upiId" placeholder="Enter UPI ID (example@upi)">
        </div>

        <!-- COD -->
        <label class="pay-option">
          <input type="radio" name="payment" value="COD">
          💵 Cash on Delivery
        </label>

      </div>

      <button type="submit" class="checkout-btn">Pay Now</button>

    </form>

  </div>

  <script>
  $(function () {

    // ✅ GET DELIVERY ID FROM URL
const urlParams = new URLSearchParams(window.location.search);
const deliveryid = urlParams.get("deliveryid");

console.log("DELIVERY ID:", deliveryid);

if (!deliveryid || deliveryid === "null") {
  alert("Delivery ID missing! Redirecting...");
  window.location.href = "cart.html"; // or previous page
  return;
}

    const showDetails = (value) => {
      $(".payment-details").slideUp(200);
      if (value === "Card") $("#cardDetails").slideDown(200);
      else if (value === "UPI") $("#upiDetails").slideDown(200);
    };

    $("input[name='payment']").change(function () {
      showDetails($(this).val());
    });

    $("#paymentForm").submit(function (e) {
      e.preventDefault();

      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      if (!cart.length) return alert("Cart is empty!");

      const payment = $("input[name='payment']:checked").val().toLowerCase();
      if (!payment) return alert("Select payment method!");

      if (payment === "Card") {
        const cardNumber = $("input[name='cardNumber']").val().trim();
        const expiry = $("input[name='expiry']").val().trim();
        const cvv = $("input[name='cvv']").val().trim();

        if (!/^\d{16}$/.test(cardNumber)) return alert("Card must be 16 digits!");
        if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(expiry)) return alert("Invalid expiry! Use MM/YY");
        if (!/^\d{3}$/.test(cvv)) return alert("CVV must be 3 digits!");
      }

      if (payment === "UPI") {
        const app = $("select[name='upiApp']").val();
        const upiId = $("input[name='upiId']").val().trim();
        const upiPattern = /^[a-zA-Z0-9._-]{2,}@[a-zA-Z]{2,}$/;

        if (!app) return alert("Select UPI App!");
        if (!upiPattern.test(upiId)) return alert("Enter valid UPI ID!");
      }

    const total = cart.reduce((sum, item) => {

  let price = item.price;
  let qty = item.quantity;

  // REMOVE ₹ symbol if present
  if (typeof price === "string") {
    price = price.replace(/[^0-9.]/g, "");
  }

  price = parseFloat(price);
  qty = parseInt(qty);

  if (isNaN(price)) price = 0;
  if (isNaN(qty)) qty = 1;

  return sum + (price * qty);

}, 0) + (cart.length ? 50 : 0);
document.getElementById("total").innerText = "₹" + total;

      // ✅ SEND TO BACKEND WITH DELIVERY ID
      fetch("save_order.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          items: cart,
          total: total,
          payment: payment,
          deliveryid: deliveryid   // ✅ FIXED HERE
        })
      })
      .then(res => res.json())
      .then(data => {
        alert("Order Saved! ID: " + data.orderid);
        localStorage.removeItem("cart");
        window.location.href = "order.html";
      });

    });

  });
</script>
</body>

</html>
