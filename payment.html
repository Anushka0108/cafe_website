<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Payment</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>

  <style>
    /* Extra inputs for card/UPI */
    .payment-details {
      display: none;
      margin-top: 10px;
    }

    .payment-details input,
    .payment-details select {
      width: 100%;
      margin: 5px 0;
      padding: 8px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <h1>Payment</h1>
      <p>Complete your order</p>
    </div>

    <!-- ORDER SUMMARY -->
    <div class="card">
      <h3>Order Summary</h3>
      <div id="summary"></div>
      <hr>
      <div class="row total">
        <span>Total</span>
        <span id="total">₹0</span>
      </div>
    </div>
    <form id="paymentForm">

      <!-- PAYMENT METHODS -->
      <div class="card">
        <h3>Select Payment Method</h3>

        <!-- CARD -->
        <label class="pay-option">
          <input type="radio" name="payment" value="Card">
          💳 Card
        </label>
        <div id="cardDetails" class="payment-details">
          <input type="text" name="cardNumber" placeholder="Card Number (16 digits)" maxlength="16">
          <input type="text" name="expiry" placeholder="MM/YY">
          <input type="text" name="cvv" placeholder="CVV (3 digits)" maxlength="3">
        </div>

        <!-- UPI -->
        <label class="pay-option">
          <input type="radio" name="payment" value="UPI">
          📱 UPI
        </label>
        <div id="upiDetails" class="payment-details">
          <select name="upiApp">
            <option value="">Select UPI App</option>
            <option>Google Pay</option>
            <option>PhonePe</option>
            <option>Paytm</option>
          </select>
          <input type="text" name="upiId" placeholder="Enter UPI ID (example@upi)">
        </div>

        <!-- COD -->
        <label class="pay-option">
          <input type="radio" name="payment" value="COD">
          💵 Cash on Delivery
        </label>

      </div>

      <button type="submit" class="checkout-btn">Pay Now</button>

    </form>

  </div>

  <script>
    $(function () {

      // DELIVERY ID CHECK
      const urlParams = new URLSearchParams(window.location.search);
      const deliveryid = urlParams.get("deliveryid");

      if (!deliveryid || deliveryid === "null") {
        alert("Delivery ID missing! Redirecting...");
        window.location.href = "cart.html";
        return;
      }

      // SHOW / HIDE PAYMENT DETAILS
      const showDetails = (value) => {
        $(".payment-details").slideUp(200);
        if (value === "Card") $("#cardDetails").slideDown(200);
        else if (value === "UPI") $("#upiDetails").slideDown(200);
      };

      $("input[name='payment']").change(function () {
        showDetails($(this).val());
      });

      // LOAD CART + DISPLAY
      const cart = JSON.parse(localStorage.getItem("cart")) || [];
      const summaryDiv = $("#summary");

      if (!cart.length) {
        summaryDiv.html("<p>Your cart is empty</p>");
        $("#total").text("₹0");
        return;
      }

      let subtotal = 0;

      cart.forEach(item => {
        let price = parseFloat(item.price);
        let qty = parseInt(item.quantity);

        if (isNaN(price)) price = 0;
        if (isNaN(qty)) qty = 1;

        let itemTotal = price * qty;
        subtotal += itemTotal;

        summaryDiv.append(`
      <div class="row">
        <span>${item.name} x ${qty}</span>
        <span>₹${itemTotal}</span>
      </div>
    `);
      });

      let delivery = 50;
      if (subtotal > 500) delivery = 5;

      let finalTotal = subtotal + delivery;
      $("#total").text("₹" + finalTotal);

      // SUBMIT PAYMENT
      $("#paymentForm").submit(function (e) {
        e.preventDefault();

        const payment = $("input[name='payment']:checked").val();
        if (!payment) return alert("Select payment method!");

        const method = payment.toLowerCase();

        // CARD VALIDATION
        if (method === "card") {
          const cardNumber = $("input[name='cardNumber']").val().trim();
          const expiry = $("input[name='expiry']").val().trim();
          const cvv = $("input[name='cvv']").val().trim();

          if (!/^\d{16}$/.test(cardNumber)) return alert("Card must be 16 digits!");
          if (!/^(0[1-9]|1[0-2])\/\d{2}$/.test(expiry)) return alert("Invalid expiry!");
          if (!/^\d{3}$/.test(cvv)) return alert("CVV must be 3 digits!");
        }

        // UPI VALIDATION
        if (method === "upi") {
          const app = $("select[name='upiApp']").val();
          const upiId = $("input[name='upiId']").val().trim();

          const upiPattern = /^[a-zA-Z0-9._-]{2,}@[a-zA-Z]{2,}$/;

          if (!app) return alert("Select UPI App!");
          if (!upiPattern.test(upiId)) return alert("Enter valid UPI ID!");
        }

        // SEND TO BACKEND
        fetch("save_order.php", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          credentials: "include",
          body: JSON.stringify({
            items: cart,
            total: finalTotal,
            payment: method,
            deliveryid: deliveryid
          })
        })
          .then(res => res.json())
          .then(data => {
            if (data.error === "Login required") {
              alert("Please login to complete your order!");
              window.location.href = "Sign_Up.html?from=payment";
              return;
            }
            if (data.error) {
              alert("Error: " + data.error);
              return;
            }

            // Save order data for order.html display
            const orderData = {
              orderid: data.orderid,
              items: cart,
              total: finalTotal,
              payment: method,
              deliveryid: deliveryid
            };
            localStorage.setItem("orderData", JSON.stringify(orderData));

            alert("Order Saved! Order ID: " + data.orderid);
            localStorage.removeItem("cart");
            window.location.href = "order.html";
          })
          .catch(err => {
            console.error(err);
            alert("Failed to save order. Please try again.");
          });

      });

    });
  </script>
</body>

</html>
